<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  body {
    min-height: 100vh;
    background: #faf8ef;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #776e65;
  }

  .game-container {
    width: 100%;
    max-width: 480px;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  .title {
    font-size: 3.5rem;
    font-weight: 800;
    color: #776e65;
    letter-spacing: -2px;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #bbada0;
    padding: 8px 18px;
    border-radius: 8px;
    text-align: center;
    color: #eee4da;
    min-width: 80px;
  }

  .score-box .label {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .score-box .value {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    gap: 12px;
  }

  .hint {
    font-size: 0.9rem;
    color: #8f857d;
    line-height: 1.4;
  }

  .new-game-btn {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .new-game-btn:hover { background: #9f8b77; }

  .grid-wrapper {
    position: relative;
    background: #bbada0;
    border-radius: 10px;
    padding: 12px;
    touch-action: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 12px;
    aspect-ratio: 1 / 1;
  }

  .tile {
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    font-weight: 800;
    background: #cdc1b4;
  }

  .tile-2    { background: #eee4da; color: #776e65; }
  .tile-4    { background: #ede0c8; color: #776e65; }
  .tile-8    { background: #f2b179; color: #f9f6f2; }
  .tile-16   { background: #f59563; color: #f9f6f2; }
  .tile-32   { background: #f67c5f; color: #f9f6f2; }
  .tile-64   { background: #f65e3b; color: #f9f6f2; }
  .tile-128  { background: #edcf72; color: #f9f6f2; font-size: 1.7rem; }
  .tile-256  { background: #edcc61; color: #f9f6f2; font-size: 1.7rem; }
  .tile-512  { background: #edc850; color: #f9f6f2; font-size: 1.7rem; }
  .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.4rem; }
  .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.4rem; box-shadow: 0 0 30px rgba(237,194,46,0.7); }
  .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 1.2rem; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.85);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 10;
  }

  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay.win { background: rgba(237, 194, 46, 0.9); }

  .overlay-text {
    font-size: 2.5rem;
    font-weight: 800;
    color: #776e65;
    text-align: center;
  }

  .overlay.win .overlay-text { color: #f9f6f2; }

  .overlay-btn {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }

  .overlay-btn:hover { background: #9f8b77; }

  @media (max-width: 480px) {
    .title { font-size: 2.5rem; }
    .tile { font-size: 1.5rem; }
    .tile-128, .tile-256, .tile-512 { font-size: 1.3rem; }
    .tile-1024, .tile-2048 { font-size: 1.1rem; }
    .hint { font-size: 0.8rem; }
  }
</style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="label">分数</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">最高</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </div>

    <div class="info-bar">
      <div class="hint">用方向键或滑动移动方块<br>相同数字合并，目标是 2048！</div>
      <button class="new-game-btn" id="new-game">新游戏</button>
    </div>

    <div class="grid-wrapper">
      <div class="grid" id="grid"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-text" id="overlay-text"></div>
        <button class="overlay-btn" id="overlay-btn">再来一局</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SIZE = 4;
      const gridEl = document.getElementById('grid');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlayEl = document.getElementById('overlay');
      const overlayTextEl = document.getElementById('overlay-text');
      const overlayBtn = document.getElementById('overlay-btn');
      const newGameBtn = document.getElementById('new-game');

      let board = [];
      let score = 0;
      let best = parseInt(localStorage.getItem('best2048') || '0', 10);
      let gameOver = false;
      let won = false;
      let keepPlaying = false;

      function init() {
        board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        score = 0;
        gameOver = false;
        won = false;
        keepPlaying = false;
        overlayEl.classList.remove('show', 'win');
        addRandomTile();
        addRandomTile();
        render();
        updateScore();
      }

      function updateScore() {
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          localStorage.setItem('best2048', best);
        }
        bestEl.textContent = best;
      }

      function addRandomTile() {
        const empty = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c] === 0) empty.push({ r, c });
          }
        }
        if (empty.length === 0) return;
        const { r, c } = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      function render() {
        const frag = document.createDocumentFragment();
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const val = board[r][c];
            const tile = document.createElement('div');
            tile.className = 'tile';
            if (val > 0) {
              tile.classList.add(val <= 2048 ? 'tile-' + val : 'tile-super');
              tile.textContent = val;
            }
            frag.appendChild(tile);
          }
        }
        gridEl.innerHTML = '';
        gridEl.appendChild(frag);
      }

      // 滑动一行/列（已按移动方向排列），返回结果和是否移动
      function slide(line) {
        const arr = line.filter(v => v !== 0);
        const result = [];
        let scoreAdd = 0;
        for (let i = 0; i < arr.length; i++) {
          if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
            const merged = arr[i] * 2;
            result.push(merged);
            scoreAdd += merged;
            i++;
          } else {
            result.push(arr[i]);
          }
        }
        while (result.length < SIZE) result.push(0);

        let moved = false;
        for (let i = 0; i < SIZE; i++) {
          if (result[i] !== line[i]) { moved = true; break; }
        }
        return { line: result, moved, scoreAdd };
      }

      function move(direction) {
        if (gameOver) return;
        if (won && !keepPlaying) return;

        let moved = false;
        let gained = 0;

        if (direction === 'left' || direction === 'right') {
          for (let r = 0; r < SIZE; r++) {
            let line = board[r].slice();
            if (direction === 'right') line.reverse();
            const res = slide(line);
            if (res.moved) moved = true;
            gained += res.scoreAdd;
            if (direction === 'right') res.line.reverse();
            board[r] = res.line;
          }
        } else {
          for (let c = 0; c < SIZE; c++) {
            let line = board.map(row => row[c]);
            if (direction === 'down') line.reverse();
            const res = slide(line);
            if (res.moved) moved = true;
            gained += res.scoreAdd;
            if (direction === 'down') res.line.reverse();
            for (let r = 0; r < SIZE; r++) board[r][c] = res.line[r];
          }
        }

        if (moved) {
          score += gained;
          addRandomTile();
          render();
          updateScore();
          checkGameState();
        }
      }

      function checkGameState() {
        if (!won && !keepPlaying) {
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              if (board[r][c] === 2048) {
                won = true;
                showOverlay('🎉 你赢了！', true);
                return;
              }
            }
          }
        }
        if (!canMove()) {
          gameOver = true;
          showOverlay('游戏结束', false);
        }
      }

      function canMove() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c] === 0) return true;
          }
        }
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const v = board[r][c];
            if (c + 1 < SIZE && board[r][c + 1] === v) return true;
            if (r + 1 < SIZE && board[r + 1][c] === v) return true;
          }
        }
        return false;
      }

      function showOverlay(text, isWin) {
        overlayTextEl.textContent = text;
        overlayEl.classList.toggle('win', isWin);
        overlayEl.classList.add('show');
        overlayBtn.textContent = isWin ? '继续游戏' : '再来一局';
      }

      // 键盘
      document.addEventListener('keydown', (e) => {
        const keyMap = {
          ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
          w: 'up', s: 'down', a: 'left', d: 'right',
          W: 'up', S: 'down', A: 'left', D: 'right'
        };
        const dir = keyMap[e.key];
        if (dir) {
          e.preventDefault();
          move(dir);
        }
      });

      // 触摸滑动
      let touchStartX = 0, touchStartY = 0;
      document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      document.addEventListener('touchend', (e) => {
        if (e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          const absDx = Math.abs(dx), absDy = Math.abs(dy);
          if (Math.max(absDx, absDy) > 30) {
            if (absDx > absDy) move(dx > 0 ? 'right' : 'left');
            else move(dy > 0 ? 'down' : 'up');
          }
        }
      }, { passive: true });

      // 按钮
      overlayBtn.addEventListener('click', () => {
        if (won && !keepPlaying) {
          keepPlaying = true;
          overlayEl.classList.remove('show');
        } else {
          init();
        }
      });

      newGameBtn.addEventListener('click', init);

      init();
    })();
  </script>
</body>
</html>
