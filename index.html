<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科学计算器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
    }

    .calculator {
      width: 380px;
      background: #1e1e2f;
      border-radius: 32px;
      padding: 22px 18px 26px;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255, 255, 255, 0.1);
    }

    /* 显示屏 */
    .display {
      position: relative;
      background: #0b0b12;
      border-radius: 20px;
      padding: 16px 16px 14px;
      margin-bottom: 20px;
      text-align: right;
      box-shadow: inset 0 5px 8px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(255, 255, 255, 0.05);
      border: 1px solid #2e2e44;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      word-break: break-all;
    }

    .display .mode {
      position: absolute;
      top: 10px;
      left: 14px;
      font-size: 0.7rem;
      color: #7a7a9a;
      letter-spacing: 1px;
      font-weight: 500;
    }

    .display .previous {
      color: #9a9ab0;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      min-height: 22px;
      font-weight: 400;
      opacity: 0.85;
      margin-top: 8px;
    }

    .display .current {
      color: #ffffff;
      font-size: 2.8rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(170, 200, 255, 0.4);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 按钮网格 */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      outline: none;
      background: #2b2b3f;
      color: #f0f0f8;
      font-size: 1.35rem;
      font-weight: 500;
      padding: 14px 4px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 0 #15151e, 0 4px 8px rgba(0, 0, 0, 0.4);
      transition: all 0.06s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      line-height: 1;
      letter-spacing: 0.3px;
      border: 1px solid #3d3d58;
    }

    button:active {
      transform: translateY(5px);
      box-shadow: 0 1px 0 #15151e, 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* 科学函数按钮 */
    button.func {
      background: #3a4a6b;
      box-shadow: 0 6px 0 #222e44, 0 4px 8px rgba(0, 0, 0, 0.4);
      color: #a8c8ff;
      font-size: 1rem;
      font-weight: 600;
      border-color: #4a5d82;
    }

    button.func:active {
      box-shadow: 0 1px 0 #222e44, 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* 运算符按钮 */
    button.operator {
      background: #f39c12;
      box-shadow: 0 6px 0 #b46f0c, 0 4px 8px rgba(0, 0, 0, 0.4);
      color: #1e1e2f;
      font-weight: 700;
      border-color: #f5b041;
    }

    button.operator:active {
      box-shadow: 0 1px 0 #b46f0c, 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    /* 等号 */
    button.equals {
      background: #2ecc71;
      box-shadow: 0 6px 0 #1f8b4c, 0 4px 8px rgba(0, 0, 0, 0.4);
      color: #1e1e2f;
      font-weight: 700;
      border-color: #58d68d;
      grid-column: span 2;
    }

    button.equals:active {
      box-shadow: 0 1px 0 #1f8b4c, 0 4px 8px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="mode">角度</div>
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <!-- 第 1 行：三角函数 -->
      <button class="func" value="sin">sin</button>
      <button class="func" value="cos">cos</button>
      <button class="func" value="tan">tan</button>
      <button class="operator" value="÷">÷</button>

      <!-- 第 2 行：幂与根号 -->
      <button class="func" value="x²">x²</button>
      <button class="func" value="x³">x³</button>
      <button class="func" value="√">√</button>
      <button class="operator" value="×">×</button>

      <!-- 第 3 行 -->
      <button value="7">7</button>
      <button value="8">8</button>
      <button value="9">9</button>
      <button class="operator" value="-">−</button>

      <!-- 第 4 行 -->
      <button value="4">4</button>
      <button value="5">5</button>
      <button value="6">6</button>
      <button class="operator" value="+">+</button>

      <!-- 第 5 行 -->
      <button value="1">1</button>
      <button value="2">2</button>
      <button value="3">3</button>
      <button class="operator" value="^">xʸ</button>

      <!-- 第 6 行 -->
      <button value="0">0</button>
      <button value=".">.</button>
      <button class="equals" value="=">=</button>
    </div>
  </div>

  <script>
    (function() {
      let currentInput = '0';
      let previousValue = null;
      let currentOperator = null;
      let waitingForNewNumber = false;
      let justPressedOperator = false;

      const currentEl = document.getElementById('current');
      const previousEl = document.getElementById('previous');

      // ---------- 数字格式化 ----------
      function formatNumber(num) {
        if (!isFinite(num) || isNaN(num)) return 'Error';
        // 处理极小的浮点误差
        if (Math.abs(num) < 1e-12) num = 0;
        let str = parseFloat(num.toFixed(12)).toString();
        // 太大或太长时用科学计数法
        if (str.length > 14) {
          str = num.toExponential(8);
        }
        return str;
      }

      // ---------- 显示更新 ----------
      function updateDisplay() {
        currentEl.textContent = currentInput;
        if (previousValue !== null && currentOperator !== null) {
          previousEl.textContent = `${previousValue} ${currentOperator}`;
        }
      }

      // ---------- 重置 ----------
      function resetCalculator() {
        currentInput = '0';
        previousValue = null;
        currentOperator = null;
        waitingForNewNumber = false;
        justPressedOperator = false;
        previousEl.textContent = '';
        updateDisplay();
      }

      // ---------- 二元运算 ----------
      function calculate(a, op, b) {
        const numA = parseFloat(a);
        const numB = parseFloat(b);
        if (isNaN(numA) || isNaN(numB)) return 'Error';

        let result;
        switch (op) {
          case '+': result = numA + numB; break;
          case '-': result = numA - numB; break;
          case '×': result = numA * numB; break;
          case '÷':
            if (numB === 0) return 'Error';
            result = numA / numB;
            break;
          case '^':
            result = Math.pow(numA, numB);
            if (!isFinite(result)) return 'Error';
            break;
          default: return 'Error';
        }
        return formatNumber(result);
      }

      // ---------- 输入数字 ----------
      function handleNumber(value) {
        if (currentInput === 'Error' || waitingForNewNumber) {
          currentInput = value;
          waitingForNewNumber = false;
        } else {
          if (currentInput === '0') {
            currentInput = value;
          } else if (currentInput.length < 14) {
            currentInput += value;
          }
        }
        justPressedOperator = false;
        updateDisplay();
      }

      // ---------- 小数点 ----------
      function handleDecimal() {
        if (currentInput === 'Error' || waitingForNewNumber) {
          currentInput = '0.';
          waitingForNewNumber = false;
        } else if (!currentInput.includes('.')) {
          currentInput += '.';
        }
        justPressedOperator = false;
        updateDisplay();
      }

      // ---------- 二元运算符 ----------
      function handleOperator(op) {
        if (currentInput === 'Error') {
          resetCalculator();
          return;
        }

        if (justPressedOperator) {
          currentOperator = op;
          if (previousValue !== null) updateDisplay();
          return;
        }

        if (previousValue === null) {
          previousValue = currentInput;
          currentOperator = op;
          waitingForNewNumber = true;
          justPressedOperator = true;
        } else {
          if (waitingForNewNumber) {
            currentOperator = op;
            justPressedOperator = true;
            previousEl.textContent = `${previousValue} ${currentOperator}`;
            return;
          }
          const result = calculate(previousValue, currentOperator, currentInput);
          if (result === 'Error') {
            currentInput = 'Error';
            previousValue = null;
            currentOperator = null;
            waitingForNewNumber = false;
            justPressedOperator = false;
            updateDisplay();
            return;
          }
          currentInput = result;
          previousValue = result;
          currentOperator = op;
          waitingForNewNumber = true;
          justPressedOperator = true;
        }
        updateDisplay();
      }

      // ---------- 一元运算（三角函数、平方、立方、开方） ----------
      function handleUnary(operation) {
        if (currentInput === 'Error') {
          resetCalculator();
          return;
        }

        const num = parseFloat(currentInput);
        if (isNaN(num)) return;

        let result;
        let historyText = '';

        switch (operation) {
          case 'sin':
            result = Math.sin(num * Math.PI / 180);
            if (Math.abs(result) < 1e-12) result = 0;
            historyText = `sin(${num}°)`;
            break;

          case 'cos':
            result = Math.cos(num * Math.PI / 180);
            if (Math.abs(result) < 1e-12) result = 0;
            historyText = `cos(${num}°)`;
            break;

          case 'tan':
            result = Math.tan(num * Math.PI / 180);
            // tan(90°) 等无定义情况
            if (!isFinite(result) || Math.abs(result) > 1e15) {
              currentInput = 'Error';
              previousValue = null;
              currentOperator = null;
              waitingForNewNumber = false;
              justPressedOperator = false;
              previousEl.textContent = `tan(${num}°)`;
              updateDisplay();
              return;
            }
            if (Math.abs(result) < 1e-12) result = 0;
            historyText = `tan(${num}°)`;
            break;

          case 'x²':
            result = num * num;
            historyText = `(${num})²`;
            break;

          case 'x³':
            result = num * num * num;
            historyText = `(${num})³`;
            break;

          case '√':
            if (num < 0) {
              currentInput = 'Error';
              previousValue = null;
              currentOperator = null;
              waitingForNewNumber = false;
              justPressedOperator = false;
              previousEl.textContent = `√(${num})`;
              updateDisplay();
              return;
            }
            result = Math.sqrt(num);
            historyText = `√(${num})`;
            break;

          default:
            return;
        }

        currentInput = formatNumber(result);
        previousEl.textContent = historyText;
        waitingForNewNumber = false;
        justPressedOperator = false;
        updateDisplay();
      }

      // ---------- 等于号 ----------
      function handleEquals() {
        if (currentInput === 'Error') {
          resetCalculator();
          return;
        }

        if (previousValue !== null && currentOperator !== null) {
          let secondOperand;
          if (waitingForNewNumber) {
            secondOperand = previousValue;
            currentInput = previousValue;
          } else {
            secondOperand = currentInput;
          }

          const result = calculate(previousValue, currentOperator, secondOperand);
          if (result === 'Error') {
            currentInput = 'Error';
            previousValue = null;
            currentOperator = null;
            waitingForNewNumber = false;
            justPressedOperator = false;
            updateDisplay();
            return;
          }
          previousEl.textContent = `${previousValue} ${currentOperator} ${secondOperand} =`;
          currentInput = result;
          previousValue = null;
          currentOperator = null;
          waitingForNewNumber = true;
          justPressedOperator = false;
          updateDisplay();
        }
      }

      // ---------- 事件绑定 ----------
      document.querySelectorAll('.buttons button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const value = btn.value;

          if (value >= '0' && value <= '9') {
            handleNumber(value);
          } else if (value === '.') {
            handleDecimal();
          } else if (value === '+' || value === '-' || value === '×' || value === '÷' || value === '^') {
            handleOperator(value);
          } else if (value === 'sin' || value === 'cos' || value === 'tan' ||
                     value === 'x²' || value === 'x³' || value === '√') {
            handleUnary(value);
          } else if (value === '=') {
            handleEquals();
          }
        });
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
