<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简约计算器 · 鼠标点击</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      padding: 16px;
    }

    .calculator {
      width: 340px;
      background: #1e1e2f;
      border-radius: 32px;
      padding: 24px 20px 28px;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.5), inset 0 1px 3px rgba(255, 255, 255, 0.1);
    }

    .display {
      background: #0b0b12;
      border-radius: 20px;
      padding: 20px 18px;
      margin-bottom: 24px;
      text-align: right;
      box-shadow: inset 0 5px 8px rgba(0, 0, 0, 0.7), 0 2px 6px rgba(255, 255, 255, 0.05);
      border: 1px solid #2e2e44;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      word-break: break-all;
    }

    .display .previous {
      color: #9a9ab0;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      min-height: 24px;
      font-weight: 400;
      opacity: 0.8;
    }

    .display .current {
      color: #ffffff;
      font-size: 3rem;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(170, 200, 255, 0.4);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      outline: none;
      background: #2b2b3f;
      color: #f0f0f8;
      font-size: 1.6rem;
      font-weight: 500;
      padding: 16px 8px;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 8px 0 #15151e, 0 4px 10px rgba(0, 0, 0, 0.4);
      transition: all 0.06s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      line-height: 1;
      letter-spacing: 0.5px;
      border: 1px solid #3d3d58;
    }

    button:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #15151e, 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    button.operator {
      background: #f39c12;
      box-shadow: 0 8px 0 #b46f0c, 0 4px 10px rgba(0, 0, 0, 0.4);
      color: #1e1e2f;
      font-weight: 600;
      border-color: #f5b041;
    }

    button.operator:active {
      box-shadow: 0 2px 0 #b46f0c, 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    button.equals {
      background: #2ecc71;
      box-shadow: 0 8px 0 #1f8b4c, 0 4px 10px rgba(0, 0, 0, 0.4);
      color: #1e1e2f;
      font-weight: 600;
      border-color: #58d68d;
      grid-column: span 2;
    }

    button.equals:active {
      box-shadow: 0 2px 0 #1f8b4c, 0 4px 8px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button value="7">7</button>
      <button value="8">8</button>
      <button value="9">9</button>
      <button class="operator" value="÷">÷</button>

      <button value="4">4</button>
      <button value="5">5</button>
      <button value="6">6</button>
      <button class="operator" value="×">×</button>

      <button value="1">1</button>
      <button value="2">2</button>
      <button value="3">3</button>
      <button class="operator" value="-">-</button>

      <button value="0">0</button>
      <button class="operator" value="+">+</button>
      <button class="equals" value="=">=</button>
    </div>
  </div>

  <script>
    (function() {
      let currentInput = '0';
      let previousValue = null;
      let currentOperator = null;
      let waitingForNewNumber = false;
      let justPressedOperator = false;

      const currentEl = document.getElementById('current');
      const previousEl = document.getElementById('previous');

      function updateDisplay() {
        currentEl.textContent = currentInput;
        if (previousValue !== null && currentOperator !== null) {
          previousEl.textContent = `${previousValue} ${currentOperator}`;
        } else {
          previousEl.textContent = '';
        }
      }

      function resetCalculator() {
        currentInput = '0';
        previousValue = null;
        currentOperator = null;
        waitingForNewNumber = false;
        justPressedOperator = false;
        updateDisplay();
      }

      function calculate(a, op, b) {
        const numA = parseFloat(a);
        const numB = parseFloat(b);
        if (isNaN(numA) || isNaN(numB)) return NaN;

        let result;
        switch (op) {
          case '+': result = numA + numB; break;
          case '-': result = numA - numB; break;
          case '×': result = numA * numB; break;
          case '÷':
            if (numB === 0) return 'Error';
            result = numA / numB;
            break;
          default: return NaN;
        }
        return Number(result.toFixed(12)).toString();
      }

      function handleNumber(value) {
        // 错误状态或等待新数字时，覆盖当前输入
        if (currentInput === 'Error' || waitingForNewNumber) {
          currentInput = value;
          waitingForNewNumber = false;
        } else {
          if (currentInput === '0') {
            currentInput = value;
          } else {
            if (currentInput.length < 12) {
              currentInput += value;
            }
          }
        }
        justPressedOperator = false;
        updateDisplay();
      }

      function handleOperator(op) {
        // 错误状态直接重置
        if (currentInput === 'Error') {
          resetCalculator();
          return;
        }

        if (justPressedOperator) {
          currentOperator = op;
          if (previousValue !== null) {
            updateDisplay();
          }
          return;
        }

        if (previousValue === null) {
          previousValue = currentInput;
          currentOperator = op;
          waitingForNewNumber = true;
          justPressedOperator = true;
        } else {
          if (waitingForNewNumber) {
            currentOperator = op;
            justPressedOperator = true;
            previousEl.textContent = `${previousValue} ${currentOperator}`;
            return;
          }
          const result = calculate(previousValue, currentOperator, currentInput);
          if (result === 'Error') {
            currentInput = 'Error';
            previousValue = null;
            currentOperator = null;
            waitingForNewNumber = true;
            justPressedOperator = false;
            updateDisplay();
            return;
          }
          currentInput = result;
          previousValue = result;
          currentOperator = op;
          waitingForNewNumber = true;
          justPressedOperator = true;
        }
        updateDisplay();
      }

      function handleEquals() {
        if (currentInput === 'Error') {
          resetCalculator();
          return;
        }
        if (previousValue !== null && currentOperator !== null) {
          let secondOperand;
          if (waitingForNewNumber) {
            secondOperand = previousValue;
            currentInput = previousValue;
          } else {
            secondOperand = currentInput;
          }

          const result = calculate(previousValue, currentOperator, secondOperand);
          if (result === 'Error') {
            currentInput = 'Error';
            previousValue = null;
            currentOperator = null;
            waitingForNewNumber = true;
            justPressedOperator = false;
            updateDisplay();
            return;
          }
          previousEl.textContent = `${previousValue} ${currentOperator} ${secondOperand} =`;
          currentInput = result;
          previousValue = null;
          currentOperator = null;
          waitingForNewNumber = true;
          justPressedOperator = false;
          updateDisplay();
        } else {
          previousEl.textContent = '';
        }
      }

      document.querySelectorAll('.buttons button').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const value = btn.value;
          if (value >= '0' && value <= '9') {
            handleNumber(value);
          } else if (value === '+' || value === '-' || value === '×' || value === '÷') {
            handleOperator(value);
          } else if (value === '=') {
            handleEquals();
          }
        });
      });

      updateDisplay();
    })();
  </script>
</body>
</html>
